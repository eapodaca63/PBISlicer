name: Build Power BI Custom Visual (.pbiviz)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pbiviz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Package Power BI visual
        run: npx pbiviz package

      - name: Upload .pbiviz artifact
        uses: actions/upload-artifact@v4
        with:
          name: ni-bulk-serial-search-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
